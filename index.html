<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Quire is a local-first journal and drawing page. Write in Markdown, sketch on the page, and export when you are ready.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2f78d6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quire">
  <title>Quire</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/reader.css">
  <link rel="stylesheet" href="styles/live.css">
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/gadgets.css">
  <link rel="stylesheet" href="styles/vista.css">
  <link rel="stylesheet" href="styles/versions.css">
  <link rel="stylesheet" href="styles/options.css">
  <link rel="stylesheet" href="styles/skins.css">
  <link rel="stylesheet" href="styles/pwa.css">
  <link rel="stylesheet" href="styles/lock.css">
  <link rel="stylesheet" href="styles/mixtape.css">
  <link rel="stylesheet" href="styles/focus.css">
  <link rel="stylesheet" href="styles/navigation.css">
  <link rel="stylesheet" href="styles/capsule.css">
</head>
<body>
  <div class="splash" id="splash" role="status" aria-label="Quire is starting">
    <div class="splash-inner">
      <img class="splash-mark" src="assets/quire-icon.svg" width="92" height="92" alt="">
      <div class="splash-name">Quire</div>
      <p class="splash-status">Loading your pages</p>
      <div class="splash-bar" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <div class="app" data-view="home">
    <header class="titlebar">
      <h1 class="sr-only">Quire</h1>
      <a class="brand" href="#/" title="All entries">
        <img class="brand-mark" src="assets/quire-icon.svg" width="18" height="18" alt="">
        <span>Quire</span>
      </a>
      <div class="titlebar-entry" id="titlebar-entry">
        <button type="button" class="titlebar-name" id="window-title" title="Click to rename this entry">Untitled</button>
        <input id="entry-title" class="entry-title" type="text" placeholder="Untitled" aria-label="Entry title" maxlength="120" autocomplete="off" spellcheck="false">
      </div>
      <div class="titlebar-status" id="save-status" role="status" aria-live="polite"></div>
    </header>

    <div class="menubar-row">
      <nav class="menubar" id="menubar" aria-label="Application menu"></nav>
      <button type="button" class="ribbon-toggle" id="ribbon-toggle" aria-controls="toolbox" aria-expanded="true" title="Minimize the ribbon"></button>
    </div>

    <nav class="entry-path" id="entry-path" aria-label="Location"></nav>

    <section class="entry-bar" aria-label="Entry details">
      <label class="field">
        <span>Date</span>
        <input id="entry-date" type="date" aria-label="Entry date">
      </label>
      <label class="field">
        <span>Kind</span>
        <select id="entry-kind" aria-label="Entry kind">
          <option value="journal">Journal</option>
          <option value="poem">Poem</option>
          <option value="blog">Blog post</option>
          <option value="note">Note</option>
        </select>
      </label>
      <label class="field">
        <span>Mood</span>
        <select id="entry-mood" aria-label="Mood"></select>
      </label>
      <label class="field">
        <span>Weather</span>
        <select id="entry-weather" aria-label="Weather"></select>
      </label>
      <label class="field field-tags">
        <span>Tags</span>
        <input id="entry-tags" type="text" placeholder="travel, winter" aria-label="Tags, comma separated" autocomplete="off">
      </label>
    </section>

    <main class="app-main" id="main">
      <div class="workspace">
        <aside class="toolbox" id="toolbox" aria-label="Tools"></aside>
        <section class="desk" aria-label="Page">
          <section class="mixtape" id="mixtape" aria-label="Mixtape"></section>
          <div class="sheet" id="sheet">
            <canvas id="grid" class="ink grid" aria-hidden="true" hidden></canvas>
            <div id="editor" class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Entry text" spellcheck="true" data-placeholder="Start writing. Try # for a heading, > for a quote, or - for a list." data-empty="true"></div>
            <canvas id="ink" class="ink" data-tool="write" aria-label="Drawing layer. Pick a drawing tool to draw on the page."></canvas>
          </div>
        </section>
      </div>

      <section class="home" id="home" aria-label="All entries"></section>
    </main>

    <section class="palette" aria-label="Colors">
      <div class="ink-chip" id="ink-chip" aria-hidden="true"><span class="chip-bg"></span><span class="chip-fg"></span></div>
      <div class="swatches" id="swatches"></div>
      <p class="palette-note">Click a color for ink or for selected text. Right-click to set the page color.</p>
    </section>

    <footer class="statusbar">
      <span id="hint" class="status-hint"></span>
      <span id="status-words"></span>
      <span id="status-mode">Markdown</span>
      <span id="status-date"></span>
    </footer>

    <!-- Focus mode (F11) shows this bar in place of the chrome: word count, session goal, and save state. -->
    <div class="focus-hud" id="focus-hud" data-goal="off">
      <span class="focus-hud-count" id="focus-count"></span>
      <span class="focus-progress" id="focus-progress" role="progressbar" aria-label="Session word goal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="focus-progress-fill" id="focus-fill"></span></span>
      <span class="focus-hud-save" id="focus-save" role="status"></span>
      <span class="focus-hud-hint">F11 or Esc to exit</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
