<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Original abstract wallpaper: a glassy blue sky with light ribbons, drawn in SVG for the Aero look. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06305e"/>
      <stop offset="0.42" stop-color="#1b65ab"/>
      <stop offset="0.72" stop-color="#4fa6e0"/>
      <stop offset="1" stop-color="#9ad7f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#e9f8ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#aee0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#aee0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3f7a"/>
      <stop offset="1" stop-color="#06254a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M-80 690 C 260 470 520 860 880 600 S 1420 300 1700 420" stroke="url(#band)" stroke-width="150" opacity="0.38" filter="url(#soft)"/>
    <path d="M-80 720 C 300 560 640 900 980 660 S 1460 430 1700 520" stroke="url(#band)" stroke-width="46" opacity="0.55" filter="url(#soft)"/>
    <path d="M-60 560 C 240 360 600 640 940 420 S 1380 170 1680 260" stroke="url(#band)" stroke-width="18" opacity="0.7"/>
    <path d="M-60 430 C 320 250 700 470 1020 300 S 1400 60 1680 140" stroke="url(#band)" stroke-width="80" opacity="0.22" filter="url(#soft)"/>
  </g>
  <path d="M0 880 C 380 800 800 960 1600 860 L1600 1000 L0 1000Z" fill="url(#hill)" opacity="0.55"/>
  <path d="M0 940 C 500 880 1000 1000 1600 930 L1600 1000 L0 1000Z" fill="url(#hill)" opacity="0.5"/>
</svg>
