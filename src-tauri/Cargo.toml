[package]
name = "quire"
version = "0.1.0"
description = "Quire: a local-first journal and drawing page"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "quire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
# Smaller binary for the installer: strip symbols, optimize for size, link once.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
