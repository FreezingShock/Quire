<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset your Quire password</title></head>
<body style="margin:0;padding:24px 16px;background:#d5dde7;font-family:Tahoma,Verdana,sans-serif;color:#1e2f44;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #a5afbb;">
    <tr><td style="background:linear-gradient(#3a78c2,#2d64aa);color:#ffffff;padding:10px 16px;font-weight:bold;font-size:15px;">Quire</td></tr>
    <tr><td style="padding:20px 16px;font-size:14px;line-height:1.5;">
      <p style="margin:0 0 12px;">Someone asked to reset the password for {{ .Email }}. Choose a new one here:</p>
      <p style="margin:0 0 20px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#3a78c2;color:#ffffff;text-decoration:none;padding:8px 18px;border:1px solid #2d64aa;">Reset my password</a></p>
      <p style="margin:0;font-size:12px;color:#4a5b70;">If you did not ask for this, ignore this email. Your password stays the same.</p>
    </td></tr>
  </table>
</body></html>
