name: Auto-merge into release

# Every PR into `release` that is ready for review runs the unit tests, then
# merges directly once they pass. `release` has no branch protection, so
# `gh pr merge --auto` cannot be used here (it needs required checks).

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [release]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test

  e2e:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e

  automerge:
    needs: [test, e2e]
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge into release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # GitHub computes mergeability in the background right after a PR
          # opens or updates, so wait for a definite answer before merging.
          state=UNKNOWN
          for attempt in 1 2 3 4 5 6; do
            state=$(gh pr view "$PR_URL" --json mergeable --jq .mergeable)
            [ "$state" != "UNKNOWN" ] && break
            sleep 5
          done
          if [ "$state" != "MERGEABLE" ]; then
            echo "Not merging: mergeable state is $state. Rebase on release and push again."
            exit 1
          fi
          gh pr merge --merge "$PR_URL"
