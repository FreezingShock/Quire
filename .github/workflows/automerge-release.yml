name: Auto-merge into release

# Every PR into `release` that is ready for review gets auto-merge turned on.
# With no required checks on the branch, GitHub merges it right away. Add
# required checks in branch protection to make auto-merge wait for them.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [release]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (merge commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
